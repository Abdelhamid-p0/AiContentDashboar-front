<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chasseur de Pièces</title>

<style>
body{
    margin:0;
    background:#111;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

#player{
    width:50px;
    height:50px;
    background:#00ff88;
    position:absolute;
    left:100px;
    top:100px;
    border-radius:50%;
}

#coin{
    width:30px;
    height:30px;
    background:gold;
    position:absolute;
    border-radius:50%;
}

#score{
    position:absolute;
    top:10px;
    left:10px;
    color:white;
    font-size:28px;
}
</style>
</head>
<body>

<div id="score">Score : 0</div>
<div id="player"></div>
<div id="coin"></div>

<script>
const player = document.getElementById("player");
const coin = document.getElementById("coin");
const scoreText = document.getElementById("score");

let x = 100;
let y = 100;
let score = 0;

function placeCoin(){
    coin.style.left =
        Math.random()*(window.innerWidth-40)+"px";
    coin.style.top =
        Math.random()*(window.innerHeight-40)+"px";
}

placeCoin();

function playSound(){
    const audio = new Audio(
      "https://actions.google.com/sounds/v1/cartoon/pop.ogg"
    );
    audio.play();
}

document.addEventListener("keydown",(e)=>{

    if(e.key==="ArrowUp") y-=15;
    if(e.key==="ArrowDown") y+=15;
    if(e.key==="ArrowLeft") x-=15;
    if(e.key==="ArrowRight") x+=15;

    player.style.left=x+"px";
    player.style.top=y+"px";

    const p=player.getBoundingClientRect();
    const c=coin.getBoundingClientRect();

    if(
      p.left<c.right &&
      p.right>c.left &&
      p.top<c.bottom &&
      p.bottom>c.top
    ){
        score++;
        scoreText.textContent="Score : "+score;
        playSound();
        placeCoin();
    }
});
</script>

</body>
</html>
